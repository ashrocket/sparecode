[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparecode"
version = "0.1.0"
description = "A small, budget-aware coding harness for open-weight models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
sparecode = "sparecode.cli:main"

[tool.setuptools.packages.find]
include = ["sparecode*"]
